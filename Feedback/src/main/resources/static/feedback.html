<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedbacks</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.01em; overflow: hidden; }
    
    .card-hover-effect { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-hover-effect:hover { transform: translateY(-6px); border-color: #818cf8; background: #fff; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05); }

    .topic-card {
        background: #ffffff;
        border: 1px solid #f1f5f9;
        padding: 30px 24px;
        border-radius: 28px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        position: relative;
        height: 310px;
    }

    .pattern-grid { background-color: #f8fafc; background-image: radial-gradient(#e2e8f0 0.5px, transparent 0.5px); background-size: 24px 24px; }

    #sidebar { width: 260px; min-width: 260px; background: #0f172a; transition: all 0.3s ease; z-index: 50;}
    #main-content { flex-grow: 1; transition: all 0.3s ease; }

    @media (max-width: 768px) {
        #sidebar { position: fixed; left: -260px; }
        #sidebar.mobile-open { left: 0; }
        #menuToggle { display: block; }
    }
    #menuToggle { display: none; }
    
    .toast { position: fixed; top: 20px; right: 20px; border-radius: 12px; transform: translateX(500px); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; z-index: 9999; padding: 14px 20px; }
    .toast.show { transform: translateX(0); opacity: 1; }
    .spinner { border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 2px solid white; width: 18px; height: 18px; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="pattern-grid flex h-screen overflow-hidden">

  <button id="menuToggle" class="fixed top-5 left-5 z-[60] bg-[#0f172a] text-white p-2.5 rounded-lg">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
  </button>
  
  <div id="overlay" class="hidden fixed inset-0 bg-slate-900/40 z-40 backdrop-blur-sm"></div>

  <div id="sidebar" class="h-screen text-white flex flex-col z-50 shadow-2xl">
    <div class="p-6 text-xl font-extrabold border-b border-white/5 flex items-center gap-3">
        <span class="bg-indigo-600 p-1.5 rounded-lg text-sm">🏛️</span> Feedback
    </div>
    <ul class="flex-grow py-4">
      <li class="mx-3 rounded-xl bg-indigo-600/10 border border-indigo-500/20">
        <a href="#" class="flex items-center gap-3 p-3.5 text-indigo-400 font-bold text-sm">
            <span>✨</span> Submit Feedback
        </a>
      </li>
    </ul>
  </div>

  <div id="main-content" class="p-4 md:p-6 flex flex-col h-screen overflow-hidden">
    <div id="toastContainer"></div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col h-full overflow-hidden">
        <div id="topicSection" class="flex flex-col h-full overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Select Topic To Submit Feedback</h1>
                </div>
            </div>
            
            <div class="flex-grow overflow-y-auto p-8 bg-slate-50/30">
                <div id="topicGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <div class="col-span-full text-center py-20 text-slate-400 font-bold animate-pulse">Syncing topics...</div>
                </div>
            </div>

            <div class="px-8 py-3 bg-white border-t border-slate-100 flex items-center justify-between">
                <span class="text-slate-400 text-[11px] font-black uppercase tracking-widest" id="pageNumDisplay">Page 1</span>
				<a href="https://www.amitit.com" class="text-blue-400 text-[11px] font-black uppercase tracking-widest" id="pageNumDisplay">AMIT IT INSTITUTE</a>

                <div class="flex gap-2">
                    <button id="prevBtn" class="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-slate-100 text-slate-500 disabled:opacity-30 uppercase tracking-wider">Prev</button>
                    <button id="nextBtn" class="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-indigo-50 text-indigo-600 hover:bg-indigo-100 uppercase tracking-wider">Next</button>
                </div>
            </div>
        </div>

        <div id="feedbackSection" class="hidden flex-grow overflow-y-auto p-8">
          <div class="max-w-xl mx-auto">
              <button id="backToTopics" class="mb-6 flex items-center gap-2 text-indigo-600 font-black text-[10px] uppercase tracking-widest hover:translate-x-[-2px] transition-all">
                ← Back to Topics
              </button>
              
              <div id="formContainer" class="bg-white p-10 rounded-[32px] shadow-sm border border-slate-200">
                <div id="inputView">
                    <div class="mb-8">
                        <h2 id="selectedTopicTitle" class="text-3xl font-extrabold text-slate-900">Topic Name</h2>
                        <p class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mt-1">Submit your thoughts</p>
                    </div>

                    <form id="feedbackForm" class="space-y-6">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Select Team</label>
                        <select id="teamSelect" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none transition-all font-bold text-slate-700 text-sm"></select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Your Feedback</label>
                        <textarea id="feedbackText" rows="5" placeholder="Detailed review..." required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none resize-none transition-all font-medium text-slate-700 text-sm"></textarea>
                    </div>
                    <button id="submitBtn" type="submit" class="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl hover:bg-indigo-700 transition-all flex items-center justify-center gap-3 uppercase tracking-widest text-xs">
                        <span id="buttonText">Submit Review</span>
                    </button>
                    </form>
                </div>

                <div id="successView" class="hidden text-center py-6">
                    <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-inner">📚</div>
                    <h2 class="text-2xl font-extrabold text-slate-900 mb-2">Review Submitted!</h2>
                    <p class="text-slate-500 text-sm font-medium mb-8">Thank you for your valuable feedback. Your review helps us grow and improve.</p>
                    <div class="flex flex-col gap-3">
                        <button onclick="resetFeedbackForm()" class="w-full py-4 bg-slate-900 text-white font-black rounded-2xl hover:bg-slate-800 transition-all uppercase tracking-widest text-[10px]">Submit Another Review</button>
                        <button onclick="$('#backToTopics').click()" class="w-full py-4 bg-slate-100 text-slate-600 font-black rounded-2xl hover:bg-slate-200 transition-all uppercase tracking-widest text-[10px]">Return to Topics</button>
                    </div>
                </div>
              </div>
          </div>
        </div>
    </div>
  </div>

<script>
    const baseUrl = window.location.protocol + "//" + window.location.hostname + ":" + window.location.port;
    let currentPage = 1;
    const pageSize = 30;

    // Handlers for error extraction
    async function handleBackendError(err, defaultMsg) {
        if (err && typeof err.json === 'function') {
            try {
                const data = await err.json();
                showToast(data.message || data.error || defaultMsg, 'error');
            } catch (e) {
                showToast(defaultMsg, 'error');
            }
        } else {
            showToast(defaultMsg, 'error');
        }
    }

    function showToast(text, type = 'info') {
        const bg = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-red-600' : 'bg-slate-900');
        const toast = $(`<div class="toast ${bg} text-white show shadow-lg"><p class="font-bold text-xs uppercase tracking-tight">${text}</p></div>`);
        $('#toastContainer').append(toast);
        setTimeout(() => { toast.removeClass('show'); setTimeout(() => toast.remove(), 500); }, 3000);
    }

    async function loadTopics() {
        try {
            const response = await fetch(`${BASE_URL}/topics?pageNo=${currentPage}&size=${pageSize}`);
            if (!response.ok) throw response;
            const topics = await response.json();
            const grid = $('#topicGrid').empty();
            
            if (!topics || topics.length === 0) {
                grid.append(`
                    <div class="col-span-full flex flex-col items-center justify-center py-20 opacity-60">
                        <div class="text-5xl mb-4">📭</div>
                        <h3 class="text-lg font-bold text-slate-900">No Topics Available</h3>
                        <p class="text-sm text-slate-500">There are currently no topics to review. Please check back later.</p>
                    </div>
                `);
                $('#pageNumDisplay').text('No Pages');
                $('#prevBtn').prop('disabled', true);
                $('#nextBtn').prop('disabled', true);
                return;
            }

            for (const t of topics) {
                const teamRes = await fetch(`${BASE_URL}/teams/${t.id}`);
                const teams = await teamRes.json();
                const teamCount = teams.length || 0;

                grid.append(`
                    <div class="topic-card card-hover-effect" onclick="selectTopic(${t.id}, '${t.name}')">
                        <div class="w-14 h-14 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center text-2xl mb-4 font-bold shadow-inner shrink-0">📚</div>
                        
                        <div class="h-[48px] w-full flex items-center justify-center overflow-hidden">
                            <h3 class="text-base font-extrabold text-slate-800 leading-tight line-clamp-2">
                                ${t.name}
                            </h3>
                        </div>
                        
                        <div class="my-5 w-full">
                            <div class="flex items-center justify-between gap-2">
                                <div class="bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100 flex-grow text-left">
                                    <span class="text-[9px] font-black uppercase text-indigo-600 tracking-wider">Teams / Subjects</span>
                                </div>
                                <div class="bg-indigo-700 px-3 py-1.5 rounded-lg min-w-[36px] text-center ml-auto">
                                    <span class="text-[10px] font-black text-white leading-none">${teamCount}</span>
                                </div>
                            </div>
                        </div>

                        <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest mt-auto">Tap to Review</p>
                    </div>
                `);
            }

            $('#pageNumDisplay').text(`Page ${currentPage}`);
            $('#prevBtn').prop('disabled', currentPage === 1);
            $('#nextBtn').prop('disabled', topics.length < pageSize);
        } catch (err) { 
            handleBackendError(err, 'Sync failed'); 
            $('#topicGrid').html('<div class="col-span-full text-center py-20 text-red-500 font-bold">Failed to load topics. Please refresh.</div>');
        }
    }

    async function selectTopic(id, name) {
        $('#selectedTopicTitle').text(name);
        $('#topicSection').addClass('hidden');
        $('#feedbackSection').removeClass('hidden').hide().fadeIn(300);
        resetFeedbackForm();

        try {
            const res = await fetch(`${BASE_URL}/teams/${id}`);
            if (!res.ok) throw res;
            const teams = await res.json();
            const select = $('#teamSelect').empty().append('<option value="" disabled selected>Choose Team</option>');
            teams.forEach(team => select.append(`<option value="${team.id}">${team.name}</option>`));
        } catch (err) { handleBackendError(err, 'Error loading teams'); }
    }

    function resetFeedbackForm() {
        $('#inputView').removeClass('hidden');
        $('#successView').addClass('hidden');
        $('#feedbackForm')[0].reset();
        $('#submitBtn').prop('disabled', false);
        $('#buttonText').text('Submit Review');
    }

    $('#feedbackForm').on('submit', async function(e) {
        e.preventDefault();
        const btn = $('#submitBtn').prop('disabled', true);
        const originalText = $('#buttonText').text();
        $('#buttonText').html('<div class="spinner"></div>');

        const payload = {
            teamId: parseInt($('#teamSelect').val()),
            feedback: $('#feedbackText').val().trim(),
            date: new Date().toISOString().split('T')[0]
        };

        try {
            const res = await fetch(`${BASE_URL}/feedback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                $('#inputView').addClass('hidden');
                $('#successView').removeClass('hidden').hide().fadeIn(400);
            } else { throw res; }
        } catch (err) {
            handleBackendError(err, 'Submission failed');
            btn.prop('disabled', false);
            $('#buttonText').text(originalText);
        }
    });

    $('#prevBtn').click(() => { if(currentPage > 1) { currentPage--; loadTopics(); } });
    $('#nextBtn').click(() => { currentPage++; loadTopics(); });
    $('#backToTopics').click(() => { $('#feedbackSection').addClass('hidden'); $('#topicSection').removeClass('hidden'); });
    $('#menuToggle').click(() => { $('#sidebar').toggleClass('mobile-open'); $('#overlay').toggleClass('hidden'); });
    $('#overlay').click(() => { $('#sidebar').removeClass('mobile-open'); $('#overlay').addClass('hidden'); });

    $(document).ready(loadTopics);
</script>
</body>
</html>
